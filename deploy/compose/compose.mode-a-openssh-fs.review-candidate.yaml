# THIRD/FINAL overlay ONLY for render-time alignment to ACTUALLY tested
# OpenSSH FS-only OCI admission. Not runnable or a release authorization.
#
# docker compose -f compose.yaml -f compose.dev-ssh.yaml \
#   -f compose.mode-a-openssh-fs.review-candidate.yaml config
#
# mvp-fs-REVIEW profile is intentionally never set by production runbooks.
# STOP78 is repeated as service entrypoint: even explicitly enabling the
# profile cannot launch sshd before signed media/no-NIC runtime/ACL review.
# DO NOT copy test-only root sshd entrypoint overrides into this file.
services:
  node01:
    profiles: ["mvp-fs-review"]
    user: "0:0"
    read_only: true
    cap_drop: !override ["ALL"]
    # Only the 4 caps established by real hosted userns-remapped OpenSSH test.
    cap_add: !override ["SETUID", "SETGID", "SETPCAP", "SYS_CHROOT"]
    # Exact sudo->setpriv admission cannot start under inherited NNP=1.
    # The immutable launcher verifies NNP=1 + zero CapBnd in the FS process.
    security_opt: !override ["no-new-privileges:false"]
    entrypoint: ["/usr/local/libexec/ssh-over-mcp-image-hold"]
    expose: !override ["2222"]
    tmpfs:
      - "/run:rw,noexec,nosuid,nodev,mode=0755,size=8m"
      - "/run/sshd:rw,noexec,nosuid,nodev,mode=0755,size=2m"
      - "/tmp:rw,nosuid,nodev,mode=1777,size=8m"
    volumes: !override
      - type: bind
        source: ${SSH_OVER_MCP_NODE01_HOSTKEYS_DIR:?required reviewed node01 root-owned host keys}
        target: /etc/ssh/hostkeys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSH_OVER_MCP_NODE01_AUTHORIZED_KEYS_DIR:?required reviewed node01 root-owned authorized keys}
        target: /etc/ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: node01-data
        target: /srv/data

  node02:
    profiles: ["mvp-fs-review"]
    user: "0:0"
    read_only: true
    cap_drop: !override ["ALL"]
    cap_add: !override ["SETUID", "SETGID", "SETPCAP", "SYS_CHROOT"]
    security_opt: !override ["no-new-privileges:false"]
    entrypoint: ["/usr/local/libexec/ssh-over-mcp-image-hold"]
    expose: !override ["2222"]
    tmpfs:
      - "/run:rw,noexec,nosuid,nodev,mode=0755,size=8m"
      - "/run/sshd:rw,noexec,nosuid,nodev,mode=0755,size=2m"
      - "/tmp:rw,nosuid,nodev,mode=1777,size=8m"
    volumes: !override
      - type: bind
        source: ${SSH_OVER_MCP_NODE02_HOSTKEYS_DIR:?required reviewed node02 root-owned host keys}
        target: /etc/ssh/hostkeys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSH_OVER_MCP_NODE02_AUTHORIZED_KEYS_DIR:?required reviewed node02 root-owned authorized keys}
        target: /etc/ssh/authorized_keys
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: node02-data
        target: /srv/data
