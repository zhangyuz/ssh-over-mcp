# TEST-ONLY OCI SSH node policy. Original/native Host Policy is unchanged.
# This profile matches SSH_OVER_MCP_PROFILE=rw-operator, but grants only
# create-only filesystem operations within the node-local /srv/data volume.
# The control plane must still separately authorize each write and mkdir.
version: 3
allowed_profiles:
  - rw-operator

child_limits:
  cpu_seconds: 10
  address_space_bytes: 536870912
  max_processes: 8
  file_size_bytes: 4194304
  open_files: 64

# v3 has no executable backend. A benign exact command placeholder is
# required by the existing HostExecutionPolicy schema and is never run.
commands:
  /usr/bin/true:
    resolved_path: /usr/bin/true
    argv:
      - mode: exact
        args: []
    allow_no_cwd: true

filesystem:
  rw-operator:
    stat_roots: [/srv/data]
    read_roots: [/srv/data]
    mkdir_roots: [/srv/data]
    write_create_roots: [/srv/data]
    max_read_bytes: 4096
    max_write_bytes: 4096

env_allow: []
max_timeout_seconds: 10
max_output_bytes: 8192
max_stdin_bytes: 0
