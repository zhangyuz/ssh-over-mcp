name: Live Local E2E

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-hex target commit to test inside a no-network disposable guest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-local-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: No-network Ubuntu 26.04 local E2E
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, ssh-over-mcp-e2e-orchestrator]
    timeout-minutes: 45
    env:
      SSH_OVER_MCP_E2E_SOURCE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Verify trusted native macOS x86 orchestrator
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0

          if id -Gn | tr ' ' '\n' | grep -qx admin; then
            echo "::error::E2E orchestrator account must not be a macOS admin"
            exit 1
          fi

          qemu-system-x86_64 --version | head -n 1 | grep -F "QEMU emulator version 11.1.2"
          qemu-img --version | head -n 1 | grep -F "11.1.2"
          test "$(sysctl -n kern.hv_support)" = "1"

          case "$COMMIT_SHA" in
            (*[!0-9a-fA-F]*|'') echo "::error::commit_sha must be exact 40-hex"; exit 1 ;;
          esac
          test "${#COMMIT_SHA}" -eq 40

      - name: Checkout trusted-main orchestrator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify trusted-main checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Run exact target in no-network QEMU guest
        shell: bash
        env:
          SSH_OVER_MCP_E2E_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/run-live-local-e2e-orchestrator.py "${{ inputs.commit_sha }}"

      - name: Verify provider state is absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYMARKER'
          import os
          import sys
          from contextlib import ExitStack

          # Check the fixed provider chain without following symlinks.
          # Only an absent *leaf* is success; unknown parents fail closed.
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          try:
              home = os.environ["HOME"]
              if not os.path.isabs(home):
                  raise ValueError("HOME must be absolute")
              with ExitStack() as opened:
                  parent_fd = os.open(home, flags)
                  opened.callback(os.close, parent_fd)
                  for component in ("Library", "Caches", "ssh-over-mcp-e2e"):
                      parent_fd = os.open(component, flags, dir_fd=parent_fd)
                      opened.callback(os.close, parent_fd)
                  try:
                      os.stat(
                          "active-run.json",
                          dir_fd=parent_fd,
                          follow_symlinks=False,
                      )
                  except FileNotFoundError:
                      pass
                  else:
                      raise ValueError("provider marker still exists (including symlink)")
          except (OSError, KeyError, ValueError) as exc:
              print(f"::error::Unable to prove provider marker absent: {exc}", file=sys.stderr)
              sys.exit(1)
          PYMARKER
