name: Live Local E2E Residual Forensic Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-local-e2e
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect exact residual directory identities without recovery
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, ssh-over-mcp-e2e-orchestrator]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main inspection authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Collect bounded private metadata evidence
        shell: bash
        run: |
          set -euo pipefail
          set -o noclobber
          python3 -I ops/live-e2e/inspect_provider_residuals.py > "$RUNNER_TEMP/provider-residuals-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Retain successful metadata evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-residuals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-residuals-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
