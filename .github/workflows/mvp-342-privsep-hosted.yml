name: MVP #342 OpenSSH privilege transition hosted proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  openssh-privsep:
    # Never run privileged test code on a self-hosted machine.
    if: github.event.pull_request.number == 342 && github.event.pull_request.head.repo.full_name == 'zhangyuz/ssh-over-mcp'
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Verify isolated GitHub-hosted Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = github-hosted
          test "${GITHUB_ACTIONS}" = true
          test "${RUNNER_OS}" = Linux
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          command -v sudo
          test -x /usr/sbin/sshd
          test -x /usr/bin/setpriv

      - name: Checkout isolated pull-request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prepare exact Python test environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run REAL Linux kernel and OpenSSH hostkey-to-FS admission proofs
        shell: bash
        run: |
          set -euo pipefail
          # No sudo wrapper around pytest: preserve hosted-only environment
          # guards. Test setup itself uses root ONLY on this disposable runner.
          python -m pytest -q -rA -s --tb=short \
            tests/ops/test_mvp_fs_privsep_linux_kernel.py \
            tests/ops/test_mvp_fs_privsep_openssh_hosted.py
