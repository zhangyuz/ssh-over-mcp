name: Hosted Ubuntu 26.04 benchmark

# A separate, explicitly non-required benchmark. Avoid pull_request_target:
# these jobs execute PR code with a read-only token and no secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-suite:
    name: Hosted benchmark / Ubuntu 26.04 / Python ${{ matrix.python-version }}
    # Opt-in PR branch prefix prevents charging minutes for unrelated PRs.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ci/hosted-'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Verify hosted Ubuntu 26.04 x86 environment
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = ubuntu
          test "${VERSION_ID}" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0

      - name: Checkout pull request merge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install complete development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint source and tests
        run: python -m ruff check src tests ops/systemd ops/live-e2e

      - name: Compile source, tests and operator scripts
        run: python -m compileall -q src tests ops/systemd ops/live-e2e

      - name: Run complete suite on Python ${{ matrix.python-version }}
        # 2 vCPU / 8 GB are the standard private-repo Ubuntu VM limits.
        # Run every test, including expensive source-bound regressions.
        run: python -m pytest -q --durations=15 -n 2 --dist=load
