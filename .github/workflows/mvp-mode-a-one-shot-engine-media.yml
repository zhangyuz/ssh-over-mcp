name: Mode A one-shot signed APT Engine media

# Operator reauthorized a future single bounded attempt (PR #342 comment #6450082397).
# PREPARED BUT DISABLED: commit/push/trigger of enabled packet was refused by
# execution safety control. Never circumvent that guard or silently run APT.
# Before any separately permitted use, verify exact new one-off marker and
# restore && false immediately after the single attempt.
# Produces non-executable candidate media ONLY, not guest/release authority.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  engine-media:
    if: github.event.action == 'synchronize' && github.event.pull_request.number == 342 && github.event.pull_request.head.repo.full_name == 'zhangyuz/ssh-over-mcp' && github.event.pull_request.head.ref == 'feat/mvp-mode-a-compose-overlay-oct24' && false
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR source without repository credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify one-off authorization and disposable x86 builder
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          git show -s --format=%B HEAD | grep -Fx 'Approved-Builder-Packet: one-off-20261027-native-apt-reauthorized'
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sources=/etc/apt/sources.list.d/ubuntu.sources
          # Ubuntu 26.04 hosted runners use mirror+file:/etc/apt/mirrors/;
          # URL selection is not an authenticity primitive. Only Ubuntu's
          # signed InRelease + deb checksums confer package authenticity.
          grep -Eq '^URIs: (https?://[^[:space:]]*ubuntu\.com/ubuntu|mirror\+file:/etc/apt/mirrors/[^[:space:]]+)' "$sources"
          grep -Eq '^Types: deb([[:space:]]|$)' "$sources"
          grep -Eq '^Suites: .*resolute' "$sources"
          grep -Eq '^Components: .*main' "$sources"
          ! grep -Eiq '^(Trusted|Allow-Insecure|Allow-Weak):[[:space:]]*(yes|true|1)([[:space:]]|$)' "$sources"
          test "$(grep '^Signed-By:' "$sources" | LC_ALL=C sort -u)" = 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
          git diff --exit-code

      - name: Resolve and download signed Ubuntu APT Engine closure on disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          # Use Ubuntu's stock _apt sandbox, root-owned index files and signed
          # official archives on the disposable runner. No OCI capability loop.
          # This touches ONLY GitHub's ephemeral runner's package index/cache.
          # Isolate official Ubuntu package indexes from preinstalled runner repos.
          lists="$RUNNER_TEMP/som342-official-apt-lists"
          sudo install -d -m 0755 "$lists"
          sudo install -d -o _apt -g root -m 0700 "$lists/partial"
          sudo apt-get update \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Dir::State::lists="$lists"
          mkdir -m 0755 media
          sudo install -d -o _apt -g root -m 0700 "$PWD/media/partial"
          # A blank dpkg status asks APT for all dependencies, not merely those
          # missing on GitHub's preinstalled runner. Download only: never install.
          sudo apt-get -o Dir::State::status=/dev/null \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=- -o Dir::State::lists="$lists" \
            -o Dir::Cache::archives="$PWD/media" \
            install --download-only -y --no-install-recommends \
            docker.io containerd runc iptables iproute2 ca-certificates
          test "$(find media -maxdepth 1 -name '*.deb' -type f | wc -l)" -gt 0
          sudo chown "$(id -u):$(id -g)" media/*.deb
          # Only allowlisted files are uploaded; APT cache metadata stays local.
          apt-cache -o Dir::State::lists="$lists" \
            -o Dir::Etc::sourceparts=- \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            policy docker.io containerd runc > media/engine-package-versions.txt
          dpkg --print-architecture > media/architecture.txt
          test "$(cat media/architecture.txt)" = amd64
          sha256sum /usr/share/keyrings/ubuntu-archive-keyring.gpg > media/ubuntu-archive-keyring.sha256
          echo 'Authenticity: Ubuntu stock APT verified signed indexes during update; independent offline verify remains required.'

      - name: Bound and hash every downloaded package byte
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          packages = sorted(Path("media").glob("*.deb"))
          assert 1 <= len(packages) <= 150, "invalid package count"
          sizes = [p.stat().st_size for p in packages]
          max_bytes = 512 * 1024 * 1024
          assert all(0 < n < 100 * 1024 * 1024 for n in sizes)
          assert sum(sizes) <= max_bytes, "media exceeds approved bound"
          assert all(p.is_file() and not p.is_symlink() for p in packages)
          assert os.environ["SOURCE_SHA"] == subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          print(f"Package files={len(packages)} total bytes={sum(sizes)}")
          PY
          # Hash filenames relative to the artifact extraction root.
          (cd media && sha256sum ./*.deb > SHA256SUMS && \
            sha256sum engine-package-versions.txt architecture.txt \
              ubuntu-archive-keyring.sha256 >> SHA256SUMS)
          cat > media/PROVENANCE.txt <<EOF
          PR=342
          SOURCE_SHA=$SOURCE_SHA
          PACKAGE_ORIGIN=ubuntu-26.04-signed-apt
          PACKAGE_CLOSURE_BASELINE=empty-dpkg-status-candidate
          ENGINE_OFFLINE_INSTALL_PROVEN=false
          SSH_IMAGE_BUILT=false
          GUEST_EXECUTED=false
          TRUSTED_KERNEL_LEVEL2_PROVEN=false
          EOF
          (cd media && sha256sum PROVENANCE.txt >> SHA256SUMS && \
            sha256sum -c SHA256SUMS)

      - name: Save bounded test-only candidate, never deploy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mvp-342-native-signed-apt-engine-candidate
          # Explicit allowlist; the APT cache has a root-owned lock file.
          path: |
            media/*.deb
            media/SHA256SUMS
            media/PROVENANCE.txt
            media/architecture.txt
            media/engine-package-versions.txt
            media/ubuntu-archive-keyring.sha256
          retention-days: 3
          if-no-files-found: error
