name: Mode A approved one-shot offline Docker Engine media

# Test-only packet approved in conversation on 2026-10-26, PR #342.
# ONE corrective disposable builder trial authorized by user continuation
# after independent diff review; old attempt 40350510565 stopped on APT EPERM.
# Exact new commit trailer one-off-20261026-capfix required. Disable after trial.
on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  engine-media:
    if: github.event.pull_request.number == 342 && github.event.pull_request.head.ref == 'feat/mvp-mode-a-compose-overlay-oct24'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved PR source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Enforce one-use authorization and disposable x86 runner
        shell: bash
        env:
          APPROVED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          git show -s --format=%B HEAD | grep -Fx 'Approved-Builder-Packet: one-off-20261026-capfix'
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test -S /var/run/docker.sock
          git diff --exit-code
          echo "Approved one-off GitHub-hosted source/Engine acquisition only; no guest or SSH image."

      - name: Download Ubuntu signed-APT Docker Engine package closure in disposable builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          chmod 0700 media
          # The digest is the previously reviewed exact linux/amd64 platform
          # descriptor, not a mutable tag or a claim of publisher signature.
          base=docker.io/library/ubuntu@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
          docker pull --platform linux/amd64 "$base"
          # Fetch-only APT sandbox: _apt UID/GID switch and ownership repair.
          # These three container-local caps are NOT sshd/manager capabilities.
          docker run --rm --platform linux/amd64 --cap-drop=ALL \
            --cap-add=SETUID --cap-add=SETGID --cap-add=CHOWN \
            --security-opt no-new-privileges --pids-limit=256 --memory=2g \
            -v "$PWD/media:/export" "$base" /bin/bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              grep -ERq "archive.ubuntu.com|security.ubuntu.com" /etc/apt/sources.list* || exit 72
              apt-get update
              apt-get install --download-only -y --no-install-recommends \
                docker.io containerd runc iptables iproute2 ca-certificates
              cp /var/cache/apt/archives/*.deb /export/
              apt-cache policy docker.io containerd runc > /export/engine-package-versions.txt
              dpkg --print-architecture > /export/architecture.txt
            '
          test "$(cat media/architecture.txt)" = amd64
          test "$(find media -maxdepth 1 -name '*.deb' -type f | wc -l)" -gt 0
          echo "Only downloaded packages from signed Ubuntu APT. No Docker daemon ran on Yuz.local."

      - name: Verify bounded media and produce per-byte hashes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          packages = sorted(Path("media").glob("*.deb"))
          assert 1 <= len(packages) <= 150, "invalid package count"
          sizes = [p.stat().st_size for p in packages]
          max_bytes = 512 * 1024 * 1024
          assert all(0 < n < 100 * 1024 * 1024 for n in sizes)
          assert sum(sizes) <= max_bytes, "media exceeds approved bound"
          assert os.environ["SOURCE_SHA"] == os.popen("git rev-parse HEAD").read().strip()
          print(f"Package archives: {len(packages)}; total bytes: {sum(sizes)}")
          PY
          sha256sum media/*.deb > media/SHA256SUMS
          sha256sum media/engine-package-versions.txt media/architecture.txt >> media/SHA256SUMS
          cat > media/PROVENANCE.txt <<EOF
          PR=342
          SOURCE_SHA=$SOURCE_SHA
          PACKAGE_ORIGIN=ubuntu-26.04-signed-apt
          BASE_PLATFORM=docker.io/library/ubuntu@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
          ENGINE_BUNDLE_ONLY=true
          SSH_IMAGE_BUILT=false
          GUEST_EXECUTED=false
          TRUSTED_KERNEL_LEVEL2_PROVEN=false
          EOF
          sha256sum media/PROVENANCE.txt >> media/SHA256SUMS
          sha256sum -c media/SHA256SUMS

      - name: Save finite test-only Engine media artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mvp-342-approved-engine-media
          path: media/
          retention-days: 3
          if-no-files-found: error
