name: Live Local E2E Approved Historical Residual Disposition

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only the three exact incident inventories approved on October 13
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-local-e2e
  cancel-in-progress: false

jobs:
  dispose:
    name: Inspect or dispose only the approved historical incident
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, ssh-over-mcp-e2e-orchestrator]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Inspect or apply the fixed approved disposition
        shell: bash
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          case "$APPLY" in
            true) python3 -I ops/live-e2e/dispose_historical_residuals.py --apply ;;
            false) python3 -I ops/live-e2e/dispose_historical_residuals.py ;;
            *) exit 70 ;;
          esac
      - name: Retain private journal including partial failure evidence
        if: always() && inputs.apply
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: incident-disposition-${{ github.run_id }}-${{ github.run_attempt }}
          path: /Users/gha-e2e-orchestrator/Library/Caches/ssh-over-mcp-e2e/incident-disposition-20261013.jsonl
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
