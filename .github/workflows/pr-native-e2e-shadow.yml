name: PR native E2E shadow metadata (informational only)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pr-native-shadow-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  admit:
    name: Read-only exact PR CI metadata observation
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify trusted default-branch checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Observe metadata without native dispatch or status write
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ops/live-e2e/pr_ci_shadow.py --event "$GITHUB_EVENT_PATH"
