name: Recover Live Local E2E Provider

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect first; clear requires the exact observed target SHA and owner PID
        required: true
        type: choice
        options:
          - inspect
          - clear
        default: inspect
      expected_target_sha:
        description: Exact stale marker target SHA; required only for clear
        required: false
        type: string
      expected_owner_pid:
        description: Exact stale marker owner PID; required only for clear
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: live-local-e2e
  cancel-in-progress: false

jobs:
  recover:
    name: Inspect or clear confirmed stale provider marker
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, X64, ssh-over-mcp-e2e-orchestrator]
    timeout-minutes: 5

    steps:
      - name: Verify dedicated recovery host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          test "$(id -u)" -ne 0
          test "$(id -un)" = "gha-e2e-orchestrator"
          test "$HOME" = "/Users/gha-e2e-orchestrator"
          if id -Gn | tr ' ' '\n' | grep -qx admin; then
            echo "::error::Recovery account must not be a macOS admin"
            exit 1
          fi
          qemu-system-x86_64 --version | head -n 1 | grep -F "QEMU emulator version 11.1.2"

      - name: Checkout trusted main recovery tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify trusted main checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Inspect or clear confirmed stale provider state
        shell: bash
        env:
          RECOVERY_ACTION: ${{ inputs.action }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          EXPECTED_OWNER_PID: ${{ inputs.expected_owner_pid }}
        run: |
          set -euo pipefail
          python3 ops/live-e2e/provider_recovery.py \
            "$RECOVERY_ACTION" \
            --expected-target "$EXPECTED_TARGET_SHA" \
            --expected-owner-pid "$EXPECTED_OWNER_PID"
