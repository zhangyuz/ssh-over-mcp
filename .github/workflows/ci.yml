name: CI

# Run untrusted PR code without pull_request_target privileges or secrets.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Full validation / Python ${{ matrix.python-version }} / ${{ matrix.partition }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        partition: ["projection-hot", "projection-rest-classified", "projection-rest-other", "rest"]
    steps:
      - name: Verify Ubuntu 26.04 non-root x86
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = ubuntu
          test "${VERSION_ID}" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0

      - name: Checkout exact pull request merge revision with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install all test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint source, tests, and operator tools
        run: python -m ruff check src tests ops/systemd ops/live-e2e

      - name: Compile all source and operator tools
        run: python -m compileall -q src tests ops/systemd ops/live-e2e

      - name: Verify hosted-only minimal non-root Linux groups
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
            --clear-groups "$(command -v python)" -c \
            'import os; assert os.getuid() == os.geteuid() != 0; assert set(os.getgroups()) <= {os.getgid()}'

      - name: Execute complete disjoint partition
        shell: bash
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          set -euo pipefail
          # Fixed original hot IDs plus 15 slowest measured source-verified
          # projection nodes from hosted PR #227 Python 3.13 run.
          # Each exact ID runs only in hot and is deselected from rest;
          # all future source-module tests default to projection-rest.
          hot_tests=(
            "tests/ops/test_live_e2e_staging_projection.py::test_dispute_overlap_page_paginates_real_valid_overflow"
            "tests/ops/test_live_e2e_staging_projection.py::test_private_series_max_eight_segments_and_128_hops"
            "tests/ops/test_live_e2e_staging_projection.py::test_dispute_overlap_valid_source_index_can_exceed_wire_capacity"
            "tests/ops/test_live_e2e_staging_projection.py::test_dispute_overlap_coverage_remains_bounded_on_valid_large_index"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_hop_filtered_page_keeps_eight_same_class_source_groups"
            "tests/ops/test_live_e2e_staging_projection.py::test_dispute_gap_page_majority_leading_trailing_and_eight_gap_bound"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_multifilter_source_clipping_matches_single_class_pages[classes0]"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_multifilter_two_classes_interleave_original_hop_order"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_multifilter_source_clipping_matches_single_class_pages[classes1]"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_hop_filtered_page_majority_clips_inside_both_source_segments"
            "tests/ops/test_live_e2e_staging_projection.py::test_series_max_eight_segments_128_hops"
            "tests/ops/test_live_e2e_staging_projection.py::test_dossier_public_maximum_8x16_on_both_sides"
            "tests/ops/test_live_e2e_staging_projection.py::test_dispute_ranks_real_sixteen_distinct_windows_upper_bound"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_hop_multifilter_page_original_source_order_and_category_subset[categories2]"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_hop_page_original_source_all_pages_and_clipped_interval"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_hop_page_clips_inside_both_distinct_source_intervals"
            "tests/ops/test_live_e2e_staging_projection.py::test_portfolio_rejects_mismatched_genuine_pair_and_sources"
            "tests/ops/test_live_e2e_staging_projection.py::test_dossier_rejects_genuine_mismatched_pair_and_source_splice"
            "tests/ops/test_live_e2e_staging_projection.py::test_classified_multifilter_source_clipping_matches_single_class_pages[classes2]"
          )
          case "${PARTITION}" in
            projection-hot)
              sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
                --clear-groups "$(command -v python)" -m pytest -q \
                --durations=15 -n 2 --dist=load "${hot_tests[@]}"
              ;;
            projection-rest-classified|projection-rest-other)
              # Fixed complementary selectors. Every non-hot node belongs
              # to exactly one projection-rest partition.
              if [[ "$PARTITION" == projection-rest-classified ]]; then
                keyword_filter="classified or dispute"
              else
                keyword_filter="not (classified or dispute)"
              fi
              deselect_args=()
              for node in "${hot_tests[@]}"; do
                deselect_args+=("--deselect=${node}")
              done
              sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
                --clear-groups "$(command -v python)" -m pytest -q \
                --durations=15 -n 2 --dist=load \
                -k "$keyword_filter" tests/ops/test_live_e2e_staging_projection.py "${deselect_args[@]}"
              ;;
            rest)
              sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
                --clear-groups "$(command -v python)" -m pytest -q \
                --durations=15 -n 2 --dist=load \
                --ignore=tests/ops/test_live_e2e_staging_projection.py
              ;;
            *) echo "::error::Unknown test partition" >&2; exit 2 ;;
          esac

  required-python:
    # Preserve historical required contexts. Each gate fails unless ALL
    # eight dual-Python shards passed (including cancelled and partial reruns).
    name: Ubuntu 26.04 x86 / Python ${{ matrix.python-version }}
    if: always()
    needs: [validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Require all six full-suite partitions to succeed
        shell: bash
        env:
          SHARDS_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [[ "${SHARDS_RESULT}" != "success" ]]; then
            echo "::error::A Python/partition failed, was skipped or cancelled"
            exit 1
          fi
          echo "All eight full-coverage test partitions passed."

  live-local-e2e:
    name: Merge-main no-network Level-3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required-python]
    uses: ./.github/workflows/live-local-e2e.yml
    with:
      commit_sha: ${{ github.sha }}
    permissions:
      contents: read
