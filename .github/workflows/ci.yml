name: CI

# Untrusted PR code must never execute with pull_request_target privileges.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Retain historical names to preserve existing required branch checks.
    name: Ubuntu 26.04 x86 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Verify GitHub-hosted Ubuntu 26.04 x86 runner
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "${ID}" = ubuntu
          test "${VERSION_ID}" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0

      - name: Checkout selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install complete test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint source and tests
        run: python -m ruff check src tests ops/systemd ops/live-e2e

      - name: Compile on Python ${{ matrix.python-version }}
        run: python -m compileall -q src tests ops/systemd ops/live-e2e

      - name: Verify strict non-root test identity
        shell: bash
        run: |
          set -euo pipefail
          # Hosted users have supplementary desktop groups. Preserve the
          # product's strict Linux process identity policy by clearing only
          # these groups; every test remains unprivileged.
          sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
            --clear-groups "$(command -v python)" -c \
            'import os; assert os.getuid() == os.geteuid() != 0; assert set(os.getgroups()) <= {os.getgid()}'

      - name: Test on Python ${{ matrix.python-version }}
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
            --clear-groups "$(command -v python)" -m pytest -q \
            --durations=15 -n 2 --dist=load

  live-local-e2e:
    name: Merge-main no-network Level-3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/live-local-e2e.yml
    with:
      commit_sha: ${{ github.sha }}
    permissions:
      contents: read
