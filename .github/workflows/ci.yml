name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  validate-py313-heavy:
    name: CI 3.13 / source-heavy
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/ci-validation-shard.yml
    with:
      python-version: "3.13"
      suite: source-heavy

  validate-py313-rest:
    name: CI 3.13 / everything-else
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/ci-validation-shard.yml
    with:
      python-version: "3.13"
      suite: everything-else

  validate-py314-heavy:
    name: CI 3.14 / source-heavy
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/ci-validation-shard.yml
    with:
      python-version: "3.14"
      suite: source-heavy

  validate-py314-rest:
    name: CI 3.14 / everything-else
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/ci-validation-shard.yml
    with:
      python-version: "3.14"
      suite: everything-else

  # Preserve both historical branch-protection checks. Four independent
  # job conclusions prevent matrix-result ambiguity after partial reruns.
  validate:
    name: Ubuntu 26.04 x86 / Python ${{ matrix.python-version }}
    if: always() && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [validate-py313-heavy, validate-py313-rest, validate-py314-heavy, validate-py314-rest]
    runs-on: [self-hosted, linux, x64, ssh-over-mcp-mac-x86]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Require all four individual CI shards PASS
        shell: bash
        env:
          CI_PY313_HEAVY: ${{ needs['validate-py313-heavy'].result }}
          CI_PY313_REST: ${{ needs['validate-py313-rest'].result }}
          CI_PY314_HEAVY: ${{ needs['validate-py314-heavy'].result }}
          CI_PY314_REST: ${{ needs['validate-py314-rest'].result }}
        run: |
          set -euo pipefail
          for name in CI_PY313_HEAVY CI_PY313_REST CI_PY314_HEAVY CI_PY314_REST; do
            result="${!name}"
            if [ "${result}" != "success" ]; then
              echo "::error::Required shard ${name} not successful: ${result}"
              exit 1
            fi
          done
          echo "All four independently resolved Python/suite shards PASS"

  live-local-e2e:
    name: Merge-main no-network Level-3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    uses: ./.github/workflows/live-local-e2e.yml
    with:
      commit_sha: ${{ github.sha }}
    permissions:
      contents: read
