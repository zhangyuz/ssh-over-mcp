name: MVP #342 OpenSSH OCI hosted test and offline handoff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # Public-repository OIDC provenance for the disposable, PR-only test tarball.
  # This does NOT authorize promotion to a production signed OCI runtime ID.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-source:
    if: github.event.pull_request.number == 342 && github.event.pull_request.head.repo.full_name == 'zhangyuz/ssh-over-mcp'
    runs-on: ubuntu-26.04
    timeout-minutes: 28
    steps:
      - name: Require disposable GitHub-hosted x86 Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_ACTIONS" = true
          . /etc/os-release
          test "$ID" = ubuntu && test "$VERSION_ID" = 26.04
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          docker info --format '{{.OSType}}/{{.Architecture}}'

      - name: Checkout exact pull-request merge snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Read-only Ubuntu Engine APT provenance diagnostics
        shell: bash
        run: |
          set -euo pipefail
          # Probe why the earlier one-off native APT trial failed *before*
          # fetching package metadata. No APT changes or release authority.
          python3 ops/mvp/mode_a_hosted_apt_probe.py

      - name: Build immutable-source OpenSSH FS base (NO guest startup)
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain --no-cache \
            -f deploy/ssh-target/Dockerfile.fs-only-review-candidate \
            -t som-mvp-fs-source:local .

      - name: Build root OpenSSH key-custody layer (NO guest startup)
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build --progress=plain --no-cache \
            --build-arg SOM_FS_SOURCE_IMAGE=som-mvp-fs-source:local \
            -f deploy/ssh-target/Dockerfile.fs-privsep-review-candidate \
            -t som-mvp-fs-privsep:local .

      - name: Bake exact no-sudo FS review image (STOP78; test-only)
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/mvp/build_native_review_image.py

      - name: Verify STOP78 entrypoint and record source-only evidence
        shell: bash
        env:
          PR_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect som-mvp-fs-privsep:local --format '{{.Config.User}}')" = '0:0'
          test "$(docker image inspect som-mvp-fs-privsep:local --format '{{json .Config.Entrypoint}}')" = '["/usr/local/libexec/ssh-over-mcp-image-hold"]'
          test "$(docker image inspect som-mvp-fs-privsep:local --format '{{json .Config.ExposedPorts}}')" = '{"2222/tcp":{}}'
          test "$(docker image inspect som-mvp-fs-native-review:local --format '{{.Config.User}}')" = '0:0'
          test "$(docker image inspect som-mvp-fs-native-review:local --format '{{json .Config.Entrypoint}}')" = '["/usr/local/libexec/ssh-over-mcp-image-hold"]'
          mkdir -p proof
          {
            echo "PR=342"
            echo "PR_SOURCE_SHA=$PR_SOURCE_SHA"
            echo "TEST_MERGE_SHA=$(git rev-parse HEAD)"
            echo "FS_BASE_IMAGE_ID=$(docker image inspect som-mvp-fs-source:local --format '{{.Id}}')"
            echo "FS_PRIVSEP_IMAGE_ID=$(docker image inspect som-mvp-fs-privsep:local --format '{{.Id}}')"
            echo "FS_NATIVE_REVIEW_IMAGE_ID=$(docker image inspect som-mvp-fs-native-review:local --format '{{.Id}}')"
            echo 'NATIVE_NOSUDO_CODE_BAKED=true'
            echo 'SIGNED_IMAGE=false'
            echo 'RUNTIME_STARTED=false'
            echo 'GUEST_VERIFIED=false'
            echo 'DEPLOYED=false'
          } > proof/PROVENANCE.txt
          sha256sum deploy/ssh-target/Dockerfile.fs-*-review-candidate \
            deploy/ssh-target/sshd_config.fs-privsep-review-candidate \
            deploy/ssh-target/sudoers.fs-privsep-review-candidate \
            requirements/runtime.lock \
            ops/mvp/ssh-over-mcp-fs-only-launcher.py \
            ops/mvp/mode_a_hosted_native_review.py \
            ops/mvp/build_native_review_image.py > proof/SOURCE_SHA256SUMS
          echo FS_ONLY_OCI_SOURCE_BUILD_OK_NO_RUNTIME

      - name: Prove actual two-node OpenSSH FS-only over OCI loopback
        id: oci_smoke
        shell: bash
        run: |
          set -euo pipefail
          # This is disposable hosted Docker with --network none. It is NOT
          # the required independently isolated no-NIC/native guest proof.
          python3 ops/mvp/mode_a_hosted_oci_fs_smoke.py
          sed -i 's/^RUNTIME_STARTED=false$/RUNTIME_STARTED_IN_DISPOSABLE_CI=true/' proof/PROVENANCE.txt
          {
            echo 'HOSTED_OCI_FS_TWO_NODE_SMOKE_PASSED=true'
            echo 'PRIVATE_USERNS_PROVEN=false'
            echo 'NO_NIC_GUEST_OCI_PROVEN=false'
          } >> proof/PROVENANCE.txt

      - name: Export hash-bound test-only offline Docker image (not signed)
        id: export_archive
        shell: bash
        run: |
          set -euo pipefail
          # Export the EXACT container image exercised above. Its embedded
          # STOP78 entrypoint remains unchanged; no real keys enter this tar.
          expected="$(docker image inspect som-mvp-fs-native-review:local --format '{{.Id}}')"
          docker save som-mvp-fs-native-review:local | gzip -n -1 > proof/som342-openssh-fs.docker.tar.gz
          test -s proof/som342-openssh-fs.docker.tar.gz
          gzip -t proof/som342-openssh-fs.docker.tar.gz
          (cd proof && sha256sum som342-openssh-fs.docker.tar.gz > OFFLINE_IMAGE_SHA256SUMS)
          # Actually prove the exported archive can be reimported.
          docker image rm som-mvp-fs-native-review:local
          gzip -dc proof/som342-openssh-fs.docker.tar.gz | docker load
          test "$(docker image inspect som-mvp-fs-native-review:local --format '{{.Id}}')" = "$expected"
          test "$(docker image inspect som-mvp-fs-native-review:local --format '{{json .Config.Entrypoint}}')" = '["/usr/local/libexec/ssh-over-mcp-image-hold"]'
          echo "OFFLINE_IMAGE_ARCHIVE_SHA256=$(cut -d ' ' -f 1 proof/OFFLINE_IMAGE_SHA256SUMS)" >> proof/PROVENANCE.txt
          echo 'OFFLINE_IMAGE_FORMAT=docker-save-gzip' >> proof/PROVENANCE.txt
          echo 'OFFLINE_TRANSFER_TEST_ONLY=true' >> proof/PROVENANCE.txt
          echo 'ARCHIVE_LOAD_TEST_PASSED=true' >> proof/PROVENANCE.txt
          echo 'SIGNED_IMAGE=false' >> proof/PROVENANCE.txt

      - name: Prove separately isolated userns-remapped Engine with same two SSH nodes
        id: userns_proof
        shell: bash
        run: |
          set -euo pipefail
          bash ops/mvp/mode_a_hosted_userns_verify.sh
          {
            echo 'HOSTED_DEDICATED_USERNS_REMAP_TEST_PASSED=true'
            echo 'TRUSTED_NO_NIC_GUEST_USERNS_PROVEN=false'
          } >> proof/PROVENANCE.txt

      - name: Attest disposable test-only image archive provenance (NOT release)
        id: attest_archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: proof/som342-openssh-fs.docker.tar.gz

      - name: Attest verified userns import identity receipt (test-only)
        id: attest_remap_receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: proof/REMAPPED_IMAGE_TEST_RECEIPT.json

      - name: Record signed test-archive claim; production image still unsigned
        shell: bash
        run: |
          set -euo pipefail
          echo 'TEST_ARCHIVE_GITHUB_PROVENANCE_ATTESTED=true' >> proof/PROVENANCE.txt
          echo 'SIGNED_IMAGE=false' >> proof/PROVENANCE.txt
          echo 'SIGNED_RUNTIME_ID=false' >> proof/PROVENANCE.txt
          echo 'DEPLOYED=false' >> proof/PROVENANCE.txt

      - name: Upload test-only hash-bound image and proof (never export secrets)
        if: ${{ always() && steps.oci_smoke.outcome == 'success' && steps.export_archive.outcome == 'success' && steps.userns_proof.outcome == 'success' && steps.attest_archive.outcome == 'success' && steps.attest_remap_receipt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mvp-342-openssh-oci-source-build
          path: proof/*
          retention-days: 3
          if-no-files-found: error
          # tar.gz is already compressed; no double zipping.
          compression-level: 0
