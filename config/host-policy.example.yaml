version: 2

# Install as /etc/ssh-over-mcp/host-policy.yaml.
# Production loader requires a regular, root-owned file which is not
# group/world-writable.
allowed_profiles:
  - developer

commands:
  /usr/bin/git:
    resolved_path: /usr/bin/git
    argv:
      - mode: prefix
        args: [status]
      - mode: prefix
        args: [diff]
      - mode: prefix
        args: [log]
    cwd_roots:
      - /srv/projects

  /usr/bin/ls:
    resolved_path: /usr/bin/ls
    argv:
      - mode: prefix
        args: ["--"]
      - mode: exact
        args: []
    cwd_roots:
      - /srv/projects

  /usr/bin/stat:
    resolved_path: /usr/bin/stat
    argv:
      - mode: prefix
        args: ["--"]
    cwd_roots:
      - /srv/projects

env_allow:
  - CI
  - LANG

max_timeout_seconds: 120
max_output_bytes: 1048576
max_stdin_bytes: 1048576
