version: 4

# Install as /etc/ssh-over-mcp/host-policy.yaml.
# Production loader requires a regular, root-owned file which is not
# group/world-writable.
allowed_profiles:
  - developer

# Host-owned hard ceilings. They are not request-controlled.
child_limits:
  cpu_seconds: 30
  address_space_bytes: 2147483648
  max_processes: 64
  file_size_bytes: 268435456
  open_files: 256

# Server-owned execution containment. Request envelopes cannot override these.
containment:
  manager_endpoint: /run/ssh-over-mcp/containment-manager.sock
  manager:
    uid: 2101
    gid: 3101
  host_agent:
    uid: 2102
    gid: 3102
  workload:
    uid: 2103
    gid: 3103
  manager_client_gid: 3199
  limits:
    memory_max_bytes: 536870912
    pids_max: 64
    cpu_quota_us: 50000
    cpu_period_us: 100000

commands:
  /usr/bin/git:
    resolved_path: /usr/bin/git
    argv:
      - mode: exact
        args: [status, --short]
      - mode: exact
        args: [log, --oneline, -n, "20"]
    cwd_roots:
      - /srv/projects

  /usr/bin/uptime:
    resolved_path: /usr/bin/uptime
    argv:
      - mode: exact
        args: []
    allow_no_cwd: true

env_allow:
  - CI
  - LANG

max_timeout_seconds: 120
max_output_bytes: 1048576
max_stdin_bytes: 1048576
